[package]
name = "cm-capture"
description = "Screen capture backends and session clock"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cm-core.workspace = true
cm-encode.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log.workspace = true
png.workspace = true
libc.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
# Linux: X11 sessions only (Wayland needs the desktop portal, see `session`).
xcap = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
# MIT. The desktop portal client (Wayland screenshots). zbus underneath; no C libraries.
# `async-io`, not `tokio`: GPUI (cm-desktop) enables ashpd with async-io and the two cannot be combined.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screenshot"] }
tokio = { version = "1", features = ["rt", "time"] }

[target.'cfg(windows)'.dependencies]
# Free space of a volume (the recording disk guard); the version cm-cursor uses.
windows = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Zlib OR Apache-2.0 OR MIT. The versions xcap already uses, so nothing extra is compiled.
# `kCGWindowLayer` is how list_targets tells document windows from menu bar, Dock and
# Control Center windows.
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
# Screen recording (ScreenCaptureKit), plain objc2 bindings as in spike S6. MIT; dispatch2 is
# Zlib OR Apache-2.0 OR MIT. `unsafe` for this lives in src/record/sck.rs.
objc2.workspace = true
block2.workspace = true
dispatch2.workspace = true
objc2-foundation = "0.3"
objc2-core-media = { workspace = true, features = ["objc2-core-video", "block2", "dispatch2"] }
objc2-screen-capture-kit = { workspace = true, features = ["objc2-core-media", "objc2-core-graphics", "objc2-core-foundation", "block2", "dispatch2", "libc"] }

[dev-dependencies]
tempfile.workspace = true
# REC-8 end-to-end test: record, kill -9, recover (cm-library does not depend on cm-capture).
cm-library.workspace = true
time = { version = "0.3", default-features = false, features = ["std"] }
