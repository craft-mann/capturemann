[package]
name = "cm-capture"
description = "Screen capture backends and session clock"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cm-core = { path = "../cm-core" }
cm-encode = { path = "../cm-encode" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
libc = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
xcap = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
# Zlib OR Apache-2.0 OR MIT. The versions xcap already uses, so nothing extra is compiled.
# `kCGWindowLayer` is how list_targets tells document windows from menu bar, Dock and
# Control Center windows.
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
# Screen recording (ScreenCaptureKit), plain objc2 bindings as in spike S6. MIT; dispatch2 is
# Zlib OR Apache-2.0 OR MIT. `unsafe` for this lives in src/record/sck.rs.
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-core-media = { version = "0.3", features = ["objc2-core-video", "block2", "dispatch2"] }
objc2-screen-capture-kit = { version = "0.3", features = ["objc2-core-media", "objc2-core-graphics", "objc2-core-foundation", "block2", "dispatch2", "libc"] }

[dev-dependencies]
tempfile = "3"
# REC-8 end-to-end test: record, kill -9, recover (cm-library does not depend on cm-capture).
cm-library = { path = "../cm-library" }
time = { version = "0.3", default-features = false, features = ["std"] }
