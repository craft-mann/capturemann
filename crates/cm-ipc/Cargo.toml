[package]
name = "cm-ipc"
description = "Client side of the daemon's local IPC: endpoints, connecting, JSON-RPC line client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
serde_json = "1"
# MIT
tokio = { workspace = true, features = ["rt", "net", "io-util", "time"] }

[target.'cfg(unix)'.dependencies]
# MIT OR Apache-2.0 (geteuid, to check who owns the runtime directory)
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
