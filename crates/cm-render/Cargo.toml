[package]
name = "cm-render"
description = "Annotation and GPU compositor rendering (preview and export)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cm-core.workspace = true
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
image = { workspace = true, features = ["png"] }
serde_json.workspace = true
tiny-skia = "0.11"
# MIT OR Apache-2.0 (the headless GPU compositor)
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl"] }
# MIT OR Apache-2.0 OR Zlib
bytemuck = { version = "1", features = ["derive"] }
# Apache-2.0 OR MIT
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
# Apple Vision text recognition (ANN-2 Auto-redact) through plain objc2 messages, as in the
# capture crates: Zlib OR Apache-2.0 OR MIT. Vision itself is loaded with dlopen at run time.
objc2.workspace = true
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSObject", "NSRange", "NSString"] }
wgpu = { version = "29", default-features = false, features = ["std", "parking_lot", "wgsl", "metal"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "29", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12"] }
