[package]
name = "cm-auth"
description = "OAuth for a desktop app (PKCE + loopback redirect), token refresh, OS keychain secret store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cm-core.workspace = true
# `scrub_secrets` only: one scrubber convention for text that may come from a server.
cm-jobs.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MIT OR Apache-2.0
async-trait.workspace = true
# MIT OR Apache-2.0
base64.workspace = true
# MIT OR Apache-2.0
sha2.workspace = true
# MIT OR Apache-2.0
getrandom.workspace = true
# MIT OR Apache-2.0
percent-encoding.workspace = true
# MIT OR Apache-2.0. Default features (`v1`): Keychain on macOS, Credential Manager on Windows.
keyring = "4.2"
# MIT. Opens the system browser.
open = "5.4"
# MIT OR Apache-2.0. The system TLS stack, as in cm-ai (see `UreqClient`).
ureq = { workspace = true, features = ["native-tls-no-default"] }
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "sync", "macros"] }
