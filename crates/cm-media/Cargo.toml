[package]
name = "cm-media"
description = "FFmpeg sidecar runner, quick exporter (screen + camera bubble + audio) and its filter-graph builder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cm-platform.workspace = true
cm-encode.workspace = true
cm-core.workspace = true
cm-render.workspace = true
cm-audio.workspace = true
cm-cursor.workspace = true
serde_json = "1"
# MIT OR Apache-2.0: the preset table (data/presets.toml and the user's override).
toml = { version = "0.8", default-features = false, features = ["parse"] }
# MIT OR Apache-2.0: renders the bubble mask and ring PNGs the filter graph reads.
image = { workspace = true, features = ["png", "jpeg"] }
# CMYK and YCCK JPEG pictures (IMP-6.AC10 to AC12): the decoder the `image` crate already uses, read
# directly for its four-component output, and a pure Rust colour engine for ICC profiles
# (MIT / Apache-2.0 and BSD-3-Clause / Apache-2.0).
zune-jpeg = "0.5"
zune-core = "0.5"
moxcms = "0.8"

[target.'cfg(unix)'.dependencies]
# kill(pid, 0): is the process that owns a `.work-*` folder still running?
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
hound.workspace = true
