[package]
name = "cm-media"
description = "FFmpeg sidecar runner, quick exporter (screen + camera bubble + audio) and its filter-graph builder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cm-core.workspace = true
cm-render.workspace = true
cm-audio.workspace = true
cm-cursor.workspace = true
serde_json = "1"
# MIT OR Apache-2.0: the preset table (data/presets.toml and the user's override).
toml = { version = "0.8", default-features = false, features = ["parse"] }
# MIT OR Apache-2.0: renders the bubble mask and ring PNGs the filter graph reads.
image = { workspace = true, features = ["png", "jpeg"] }

[target.'cfg(unix)'.dependencies]
# kill(pid, 0): is the process that owns a `.work-*` folder still running?
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
hound.workspace = true
