[package]
name = "cm-library"
description = "Capture bundles (.cmshot/.cmrec), manifest, SQLite index, search, thumbnails"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cm-core.workspace = true
cm-encode.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", default-features = false, features = ["std", "serde-well-known", "formatting", "parsing", "macros"] }
# SQLite (public domain) is compiled in via the `bundled` feature; rusqlite is MIT.
rusqlite = { workspace = true, features = ["bundled"] }
image = { workspace = true, features = ["png", "jpeg"] }
sha2.workspace = true
hound.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
