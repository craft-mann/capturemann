[package]
name = "cm-encode"
description = "Hardware recording encoders and the fragmented MP4 writer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cm-core = { path = "../cm-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# macOS: AVAssetWriter (VideoToolbox) fed with IOSurface-backed CMSampleBuffers, plain objc2
# bindings, no Swift bridge. The versions spike S6 proved. All MIT (dispatch2: Zlib OR Apache-2.0
# OR MIT). `unsafe` is confined to `src/mac.rs`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video", "objc2-quartz-core", "objc2-core-graphics", "block2", "dispatch2", "objc2-uniform-type-identifiers"] }
objc2-core-media = { version = "0.3", features = ["objc2-core-video", "block2", "dispatch2"] }
objc2-core-foundation = "0.3"
objc2-core-video = "0.3"
objc2-uniform-type-identifiers = "0.3"

[dev-dependencies]
tempfile = "3"
