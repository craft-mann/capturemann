[package]
name = "cm-encode"
description = "Hardware recording encoders and the fragmented MP4 writer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cm-platform.workspace = true
cm-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log.workspace = true

# macOS: AVAssetWriter (VideoToolbox) fed with IOSurface-backed CMSampleBuffers, plain objc2
# bindings, no Swift bridge. The versions spike S6 proved. All MIT (dispatch2: Zlib OR Apache-2.0
# OR MIT). `unsafe` is confined to `src/mac.rs`.
[target.'cfg(target_os = "macos")'.dependencies]
# `exception`: catch the NSException AVFoundation throws for output settings it rejects (see mac.rs).
objc2 = { workspace = true, features = ["exception"] }
block2.workspace = true
objc2-foundation = "0.3"
objc2-av-foundation = { workspace = true, features = ["objc2-core-media", "objc2-core-video", "objc2-quartz-core", "objc2-core-graphics", "block2", "dispatch2", "objc2-uniform-type-identifiers"] }
objc2-core-media = { workspace = true, features = ["objc2-core-video", "block2", "dispatch2"] }
objc2-core-foundation.workspace = true
objc2-core-video.workspace = true
objc2-uniform-type-identifiers.workspace = true

# Windows: the Media Foundation hardware H.264 encoder (NVENC / Quick Sync / AMF behind the
# transform), src/windows.rs. The version cm-capture and cm-cursor use; MIT OR Apache-2.0.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }

[dev-dependencies]
tempfile.workspace = true
