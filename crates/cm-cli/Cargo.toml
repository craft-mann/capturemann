[package]
name = "cm-cli"
description = "capturemann command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cm-core.workspace = true
cm-platform.workspace = true
cm-ipc.workspace = true
serde_json = "1"
# MIT OR Apache-2.0
clap = { version = "4", features = ["derive", "env", "std", "help", "usage", "error-context", "suggestions"] }
# MIT
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "io-util", "time", "macros", "signal"] }
# MIT OR Apache-2.0
base64.workspace = true

[dev-dependencies]
cm-daemon.workspace = true
cm-capture.workspace = true
cm-library.workspace = true
cm-jobs.workspace = true
cm-storage.workspace = true
cm-publish.workspace = true
tempfile.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[[bin]]
name = "capturemann"
path = "src/main.rs"
