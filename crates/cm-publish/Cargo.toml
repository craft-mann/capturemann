[package]
name = "cm-publish"
description = "PublishProvider trait, platform rules and metadata validation, and the YouTube provider"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cm-core.workspace = true
# The HTTP seam (`StorageHttp`), `TokenSource`, `Progress` and `ResumeState` are shared with the
# storage providers instead of being copied.
cm-storage.workspace = true
# `scrub_secrets` only: server text is scrubbed before it reaches a message.
cm-jobs.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MIT OR Apache-2.0
async-trait.workspace = true
# MIT OR Apache-2.0
sha2.workspace = true
# MIT
tokio = { workspace = true, features = ["rt", "time", "sync"] }
# MIT OR Apache-2.0
percent-encoding.workspace = true

[features]
# The in-process fake YouTube server, for the tests of other crates.
testing = ["cm-storage/testing"]

[dev-dependencies]
cm-storage = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
