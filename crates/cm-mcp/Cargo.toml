[package]
name = "cm-mcp"
description = "MCP server (stdio and local HTTP)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "cm-mcp"
path = "src/main.rs"

[dependencies]
cm-core.workspace = true
cm-ipc.workspace = true
# Apache-2.0
rmcp = { version = "3.5.1", default-features = false, features = ["server", "client", "macros", "transport-io", "transport-async-rw", "transport-streamable-http-server"] }
# MIT
http = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# MIT OR Apache-2.0
getrandom.workspace = true
serde_json = "1"
# MIT
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "io-util", "io-std"] }

[dev-dependencies]
cm-daemon.workspace = true
cm-capture.workspace = true
cm-library.workspace = true
cm-jobs.workspace = true
cm-storage.workspace = true
cm-publish.workspace = true
tempfile.workspace = true
# MIT OR Apache-2.0
async-trait.workspace = true
tokio = { workspace = true, features = ["process"] }
