[package]
name = "cm-core"
description = "Primitives (MediaTime, geometry), documents, actions, commands, undo, revisions, shared error codes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Exposes `cm_core::testing` (a simple document + commands) to downstream test suites.
testing = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
time = { workspace = true, features = ["macros"] }
hound = "3.5"
tempfile = "3"
