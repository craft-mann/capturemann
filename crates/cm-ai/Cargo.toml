[package]
name = "cm-ai"
description = "Local AI: Whisper transcripts and captions, model manager, auto-zoom and cut suggestions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# The speaker engine (AI-8): sherpa-onnx, linked statically from the prebuilt libraries that
# `make sherpa` fetches (packaging/sherpa). On by default so CI and `make bundle` have it; build a
# machine that has not run `make sherpa` with `--no-default-features` (no speaker engine: `diarize`
# then answers `no_speaker_model`).
default = ["sherpa"]
sherpa = ["dep:sherpa-onnx"]

[dependencies]
cm-core.workspace = true
cm-cursor.workspace = true
cm-library.workspace = true
# FFmpeg lookup only (`tools::locate`): one set of rules for CM_FFMPEG, next to the exe, PATH.
cm-media.workspace = true
serde = { version = "1", features = ["derive"] }
# Unicode composition (NFC) and grapheme boundaries for the Vietnamese-exact text matching of the
# glossary and of find and replace in captions (the same crates the desktop app already uses).
icu_normalizer = { workspace = true, features = ["compiled_data"] }
unicode-segmentation.workspace = true
serde_json = "1"
# MIT OR Apache-2.0
sha2.workspace = true
# MIT OR Apache-2.0. The system TLS stack (Security.framework, schannel): no ring, no bundled root list.
ureq = { workspace = true, features = ["native-tls-no-default"] }
# Unlicense (a public domain dedication). It builds whisper.cpp and ggml (MIT) from source, so it
# needs `cmake` and a C++ toolchain at build time. See `[[licenses.exceptions]]` in deny.toml.
whisper-rs = "0.16"

# Apache-2.0, vendored in vendor/ (build.rs trimmed: no download, no unpack). Optional: feature `sherpa`.
sherpa-onnx = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[dev-dependencies]
tempfile.workspace = true
hound.workspace = true

# Accuracy baseline for the 0.2.3 work (not shipped): needs the speaker engine.
[[example]]
name = "baseline"
required-features = ["sherpa"]
