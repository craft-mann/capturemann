[package]
name = "cm-daemon"
description = "Action bus, sessions, JSON-RPC server, event stream, confirmation gate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# `sherpa`: the speaker engine of cm-ai (needs the libraries of `make sherpa`).
default = ["sherpa"]
sherpa = ["cm-ai/sherpa"]

[dependencies]
log.workspace = true
cm-core.workspace = true
cm-platform.workspace = true
cm-ipc.workspace = true
cm-library.workspace = true
cm-capture.workspace = true
cm-encode.workspace = true
cm-audio.workspace = true
cm-camera.workspace = true
cm-cursor.workspace = true
cm-render.workspace = true
cm-jobs.workspace = true
cm-media.workspace = true
cm-ai.workspace = true
cm-storage.workspace = true
# The YouTube provider, platform rules and the accounts store of `publish_video`.
cm-publish.workspace = true
# Token source of the cloud destinations (keychain tokens, refresh on demand).
cm-auth.workspace = true
serde = { version = "1", features = ["derive"] }
# preserve_order: the confirmation dialog rows keep the order they are built in (R2-10)
serde_json = { version = "1", features = ["preserve_order"] }
time = { version = "0.3", default-features = false, features = ["std", "serde-well-known", "formatting", "parsing"] }
# MIT
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util", "signal"] }
# MIT OR Apache-2.0
async-trait.workspace = true
base64.workspace = true
# MIT OR Apache-2.0
image = { workspace = true, features = ["png", "jpeg"] }

# macOS: `delete_capture` moves a bundle to the Trash with NSFileManager. Same objc2 family and
# versions the capture and camera crates already use (MIT / Zlib / Apache-2.0).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, features = ["exception"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError", "NSException"] }

[dev-dependencies]
# The fake Drive server for the cloud upload tests.
cm-storage = { workspace = true, features = ["testing"] }
# The fake YouTube server for the publish tests.
cm-publish = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
time = { version = "0.3", features = ["macros"] }
