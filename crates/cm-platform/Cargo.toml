[package]
name = "cm-platform"
description = "The few OS-specific primitives the headless crates share (host clock, memory probes, folders, sleep inhibitor); every other crate stays free of target_os"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# The version cm-cursor and cm-capture use.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Performance", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Threading"] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
# MIT. Recycle Bin on Windows, the freedesktop.org Trash on Linux. (macOS moves files to the Trash with
# NSFileManager in cm-daemon.)
trash = { version = "5.2", default-features = false, features = ["coinit_apartmentthreaded"] }

# macOS: NSFileManager, the same objc2 family the capture and daemon crates use (MIT / Zlib / Apache-2.0).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError"] }

[dev-dependencies]
tempfile.workspace = true
