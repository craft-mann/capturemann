[package]
name = "cm-storage"
description = "StorageProvider trait and the local folder, drive and NAS provider"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cm-core = { path = "../cm-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MIT OR Apache-2.0
async-trait = "0.1"
# MIT OR Apache-2.0
sha2 = "0.10"
# MIT
tokio = { version = "1", features = ["rt", "time", "sync"] }
# `scrub_secrets` only: one scrubber convention for text that may come from a server.
cm-jobs = { path = "../cm-jobs" }
# MIT OR Apache-2.0
percent-encoding = "2"
# MIT OR Apache-2.0. The system TLS stack, as in cm-auth.
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }

[features]
# The in-process fake Drive server, for the tests of other crates.
testing = []

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "test-util"] }
