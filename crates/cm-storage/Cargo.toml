[package]
name = "cm-storage"
description = "StorageProvider trait and the local folder, drive and NAS provider"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cm-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MIT OR Apache-2.0
async-trait.workspace = true
# MIT OR Apache-2.0
sha2.workspace = true
# MIT
tokio = { workspace = true, features = ["rt", "time", "sync"] }
# `scrub_secrets` only: one scrubber convention for text that may come from a server.
cm-jobs.workspace = true
# MIT OR Apache-2.0
percent-encoding.workspace = true
# MIT OR Apache-2.0. The system TLS stack, as in cm-auth.
ureq = { workspace = true, features = ["native-tls-no-default"] }

[features]
# The in-process fake Drive server, for the tests of other crates.
testing = []

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
