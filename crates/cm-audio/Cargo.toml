[package]
name = "cm-audio"
description = "Mic and system audio capture, level meters and denoise"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
cm-core.workspace = true
# Apache-2.0. Microphone input (CoreAudio / WASAPI); also WASAPI loopback of the default output on Windows.
cpal = "0.18"
# MIT OR Apache-2.0. Pure-Rust FFT resampler for non-48 kHz devices (exact ratios, no C code).
rubato = "5"
# BSD-3-Clause. Pure-Rust port of Xiph RNNoise (model weights embedded). The `bin` feature stays off.
nnnoiseless = { version = "0.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Zlib OR Apache-2.0 OR MIT (objc2 family) and MIT (block2, libc).
objc2.workspace = true
block2.workspace = true
dispatch2.workspace = true
objc2-foundation = "0.3"
objc2-av-foundation.workspace = true
objc2-core-media.workspace = true
objc2-core-audio-types = "0.3"
objc2-screen-capture-kit.workspace = true
objc2-core-graphics.workspace = true
objc2-core-foundation.workspace = true

[dev-dependencies]
hound.workspace = true
tempfile.workspace = true
