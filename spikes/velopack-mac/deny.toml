# NFR-12: no GPL or AGPL code in shipped binaries.
[licenses]
allow = [
  "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "MIT-0", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "BSL-1.0",
]
confidence-threshold = 0.9
# whisper-rs and whisper-rs-sys (the whisper.cpp binding, `cm-ai`) declare the Unlicense, a public
# domain dedication; the whisper.cpp and ggml sources they build are MIT. Allowed for these two
# crates only, so a new Unlicense dependency elsewhere still fails the check.
exceptions = [
  { allow = ["Unlicense"], crate = "whisper-rs" },
  { allow = ["Unlicense"], crate = "whisper-rs-sys" },
]

[advisories]
# Only `unmaintained` advisories are ignored: all are transitive via gpui (pre-release), usvg or zbus,
# with no fixed version to move to. Revisit the list on every gpui upgrade.
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, transitive via gpui-pre/usvg/zbus, no fix available; revisit on upgrade" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: unmaintained, transitive via gpui-pre/usvg/zbus, no fix available; revisit on upgrade" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz: unmaintained, transitive via gpui-pre/usvg/zbus, no fix available; revisit on upgrade" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained, transitive via gpui-pre/usvg/zbus, no fix available; revisit on upgrade" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained, transitive via gpui-pre/usvg/zbus, no fix available; revisit on upgrade" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained, transitive via gpui-pre/usvg/zbus, no fix available; revisit on upgrade" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained, transitive via gpui-pre/usvg/zbus, no fix available; revisit on upgrade" },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
