[package]
name = "spike-ui-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# gpui is not on crates.io under its own name past 0.2.2 (Oct 2025); the zed-industries
# `gpui-pre` weekly snapshot is the maintained path. `runtime_shaders` compiles the Metal
# shaders at runtime so the Metal toolchain (full Xcode) is not needed at build time.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["runtime_shaders", "font-kit"] }
image = { version = "0.25", default-features = false }
