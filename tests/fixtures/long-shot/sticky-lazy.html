<!doctype html>
<!-- Long Shot test page without internet (BUG-6, the YouTube and carchargeos.com shape):
     a sticky masthead, a tab bar that becomes sticky below it once the page has scrolled, and
     a grid of numbered cards whose pictures load lazily (an IntersectionObserver swaps a grey
     placeholder for a generated picture a moment after the card comes into view). Open it in a
     browser and run an Auto scroll Long Shot of the window; every card shows its number, so a
     missing or repeated card shows in the stitched image.
       ?cards=N   number of cards (default 120, two per row of the grid)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Long Shot sticky and lazy page</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; background: #fff; color: #111; font: 600 18px/1.3 "Segoe UI", Arial, Helvetica, sans-serif; }
  .mast { position: sticky; top: 0; z-index: 3; height: 56px; background: #fff; display: flex; align-items: center; padding: 0 24px; font-size: 24px; border-bottom: 1px solid #ddd; }
  .hero { height: 320px; background: linear-gradient(120deg, #123 0%, #36a 60%, #8bd 100%); color: #fff; display: flex; align-items: center; padding: 0 40px; font-size: 40px; }
  .tabs { position: sticky; top: 56px; z-index: 2; height: 48px; background: #fff; display: flex; gap: 28px; align-items: center; padding: 0 24px; box-shadow: 0 2px 4px rgba(0,0,0,.25); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px 24px; padding: 24px; }
  .card .pic { height: 190px; border-radius: 12px; background: #e3e3e3; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 40px; }
  .card .title { margin-top: 8px; }
  .card .meta { color: #666; font-weight: 400; }
</style>
</head>
<body>
<div class="mast">Sticky masthead</div>
<div class="hero">Hero banner</div>
<div class="tabs"><span>Home</span><span>Videos</span><span>Shorts</span><span>Live</span></div>
<div class="grid" id="grid"></div>
<script>
  const q = new URLSearchParams(location.search);
  const n = Math.max(2, parseInt(q.get('cards') || '120', 10));
  const grid = document.getElementById('grid');
  for (let i = 1; i <= n; i++) {
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = '<div class="pic" data-n="' + i + '"></div><div class="title">Card ' + String(i).padStart(4, '0') + ' title that wraps onto a second line for a few of them' + (i % 3 ? '' : ' and a longer tail of words') + '</div><div class="meta">' + (i * 7) % 90 + 'K views, ' + (i % 11) + ' weeks ago</div>';
    grid.appendChild(c);
  }
  const hue = k => (k * 47) % 360;
  const io = new IntersectionObserver(es => {
    for (const e of es) {
      if (!e.isIntersecting) continue;
      const el = e.target; io.unobserve(el);
      setTimeout(() => { el.style.background = 'linear-gradient(135deg, hsl(' + hue(+el.dataset.n) + ',60%,35%), hsl(' + hue(+el.dataset.n + 3) + ',60%,60%))'; el.textContent = '#' + el.dataset.n; }, 250);
    }
  }, { rootMargin: '0px' });
  document.querySelectorAll('.pic').forEach(p => io.observe(p));
</script>
</body>
</html>
