[package]
name = "cm-desktop"
description = "Editor, library, settings and publish sheet"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# `sherpa`: the speaker engine (needs the libraries of `make sherpa`); `--no-default-features` builds without.
default = ["sherpa"]
sherpa = ["cm-daemon/sherpa", "cm-ai/sherpa"]

[dependencies]
log.workspace = true
cm-core.workspace = true
cm-platform.workspace = true
cm-library.workspace = true
# UI languages: tr!, the catalogues in locales/, locale-aware sizes and dates.
cm-i18n.workspace = true
cm-capture.workspace = true
cm-daemon.workspace = true
cm-storage.workspace = true
cm-publish.workspace = true
# Connect a cloud drive (STO-2): OAuth with the system browser, secrets in the keychain.
cm-auth.workspace = true
# Connect YouTube (PUB-1) and the publish sheet's rules and validation (PUB-2).
cm-render.workspace = true
# `tools::locate()`: one place that finds FFmpeg (CM_FFMPEG, the bundle, PATH) for the poster frames.
cm-media.workspace = true
cm-camera.workspace = true
# Non-prompting permission checks only (Settings > Privacy, the Screen Recording banner).
cm-audio.workspace = true
cm-cursor.workspace = true
# Local AI types shared with the daemon (models, transcript, captions, suggestions).
cm-ai.workspace = true
# Destinations (STO-1): the app is the only writer of destinations.json.
# GPUI (Apache-2.0), exact pin per docs/project/spikes.md S5. `runtime_shaders` compiles Metal shaders at
# run time (no full Xcode needed); `font-kit` is required or no text is drawn.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["runtime_shaders", "font-kit"] }
anyhow = "1"
# Grapheme clusters for the caret and backspace (MIT/Apache-2.0, already in the lock file).
unicode-segmentation.workspace = true
# NFC for the caption find (Vietnamese typed as NFC or NFD matches the same; Unicode-3.0, already in the lock file via url).
icu_normalizer = { workspace = true, features = ["compiled_data"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait.workspace = true
base64.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util", "net"] }
image = { workspace = true, features = ["png", "jpeg", "ico", "tiff"] }
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing", "local-offset"] }
# MIT OR Apache-2.0
global-hotkey = "0.9.0"
tray-icon = "0.26.1"
dirs = "7.0.0"
# MIT OR Apache-2.0 OR Zlib: the NSWindow behind a GPUI window (capture exclusion, click-through).
raw-window-handle = "0.6"

[dev-dependencies]
tempfile.workspace = true
hound.workspace = true
# GPUI's headless test platform: keystrokes and text input without a window server.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
# The fake Drive server for the connect-flow tests.
cm-storage = { workspace = true, features = ["testing"] }

# Dock icon at run time (macOS only); versions already in the lockfile through tray-icon.
# Windows clipboard (macOS writes the pasteboard itself, with a TIFF flavor).
[target.'cfg(not(target_os = "macos"))'.dependencies]
arboard = { workspace = true, features = ["image-data"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Large-block allocator (src/alloc.rs); already in the lockfile.
libc.workspace = true
objc2.workspace = true
# The CVPixelBuffer path into GPUI's `surface()`; same versions as GPUI (one copy in the lockfile).
objc2-core-video.workspace = true
objc2-core-foundation.workspace = true
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSImage", "NSResponder", "NSRunningApplication", "NSWorkspace", "NSAccessibility", "NSWindow", "NSView", "NSScreen", "NSColor", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSArray", "NSGeometry", "NSString"] }

# Linux windowing backends: without `wayland` or `x11` GPUI starts but opens no window.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["wayland", "x11"] }
# The wlr/ext data-control protocol for wlroots and KDE (wl-clipboard-rs, MIT OR Apache-2.0).
# GNOME has none, so arboard falls back to X11 through XWayland there.
arboard = { workspace = true, features = ["image-data", "wayland-data-control"] }
# MIT. The GlobalShortcuts portal (Wayland global hotkeys). The `async-io` runtime, as in
# cm-capture: gpui's Linux dependencies already enable it and ashpd refuses two runtimes.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
# MIT OR Apache-2.0. `block_on` for the portal calls.
futures-lite = "2"
