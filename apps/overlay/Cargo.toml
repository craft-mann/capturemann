[package]
name = "cm-overlay"
description = "Region picker, webcam bubble window and recording control bar"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
log.workspace = true
cm-core.workspace = true
# UI language of the hint labels (no dependencies of its own).
cm-i18n.workspace = true
# Client side only (`connect`, `Endpoint`, JSON-RPC client); the overlay never links an
# engine crate.
cm-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
# MIT
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "io-util", "time", "macros"] }
# MIT OR Apache-2.0
base64.workspace = true
# MIT OR Apache-2.0
image = { workspace = true, features = ["png"] }
# Apache-2.0
winit = "0.30"
# MIT OR Apache-2.0
softbuffer = "0.4"
# Apache-2.0
ab_glyph = "0.2"
# MIT OR Apache-2.0 (text only: no image-data feature)
arboard.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# MIT. The same versions winit uses, so nothing extra is compiled.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSScreen", "NSView", "NSResponder"] }

[target.'cfg(windows)'.dependencies]
# MIT OR Apache-2.0
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# Tests run the overlay's session against an in-process daemon on a real socket.
cm-daemon.workspace = true
cm-capture.workspace = true
cm-library.workspace = true
tempfile.workspace = true
