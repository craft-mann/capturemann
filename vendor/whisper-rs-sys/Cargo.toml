# Vendored from whisper-rs-sys 0.15.0 (crates.io; Unlicense; whisper.cpp 1.8.3 and ggml inside are
# MIT), with one change to whisper.cpp: `whisper_exp_compute_token_level_timestamps_dtw` returns
# without DTW times for a decode window it cannot align (fewer than 16 audio frames, or more than
# the encoder context) instead of aborting the process in `median_filter`. build.rs, wrapper.h and
# src/ are unchanged. The ggml backends no Cargo feature of this crate can turn on (CANN, Hexagon,
# MUSA, OpenCL, RPC, WebGPU, zDNN, ZenDNN) are left out of whisper.cpp/ggml/src; every other
# backend and every feature is kept. See vendor/README-CaptureMann.md for the exact diff.

[package]
edition = "2021"
rust-version = "1.88.0"
name = "whisper-rs-sys"
version = "0.15.0"
build = "build.rs"
links = "whisper"
description = "Rust bindings for whisper.cpp (FFI bindings; vendored copy with one whisper.cpp patch)"
documentation = "https://docs.rs/whisper-rs-sys"
license = "Unlicense"
repository = "https://codeberg.org/tazz4843/whisper-rs"
publish = false

[features]
coreml = []
cuda = []
force-debug = []
hipblas = []
intel-sycl = []
metal = []
openblas = []
openmp = []
vulkan = []

[lib]
name = "whisper_rs_sys"
path = "src/lib.rs"

[build-dependencies]
bindgen = "0.72"
cfg-if = "1"
cmake = "0.1"
fs_extra = "1.3"
semver = "1.0"

# Not a member of the CaptureMann workspace (see vendor/README-CaptureMann.md); this empty table also
# stops cargo from looking for a workspace further up the tree.
[workspace]
