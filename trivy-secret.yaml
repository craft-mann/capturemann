# Trivy reads this file from the repository root. It lists the places where fake credentials are
# deliberate: the Auto-redact detector and the OAuth tests build strings that look like keys and
# tokens to prove they are found, hidden and never logged. No real secret belongs anywhere else.
allow-rules:
  - id: test-fixtures
    description: Fake keys and tokens in tests and in the Auto-redact detector's cases
    path: '^(crates/cm-render/src/ocr/|.*/tests?/|.*_?tests?\.rs$)'
