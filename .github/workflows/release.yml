name: Release

# Push a tag such as `v0.0.1` to build the macOS app and open a DRAFT GitHub release with the zip and
# its SHA-256. Nothing is published until you review the draft and press Publish.
#
# The build is ad hoc signed (no Developer ID yet). When the Apple Developer ID certificate is
# ready, add the signing and notarization steps here (import the certificate into a temporary
# keychain, `CM_SIGN_IDENTITY`, `CM_HARDENED=1 make bundle-release`, `xcrun notarytool submit --wait`,
# `xcrun stapler staple`) and drop the "ad hoc" wording from the release notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write # create the draft release
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "v$version" != "$TAG" ]; then echo "tag $TAG does not match workspace version $version"; exit 1; fi

      - name: Build the LGPL FFmpeg (pinned sources)
        run: make ffmpeg
      - run: make licenses
      - name: Bundle (fails unless FFmpeg and its licence files are included)
        run: make bundle-release
      - run: codesign --verify --deep --strict target/bundle/CaptureMann.app

      - name: Zip and checksum
        run: |
          cd target/bundle
          ditto -c -k --keepParent CaptureMann.app "CaptureMann-${TAG}-macos-arm64.zip"
          shasum -a 256 "CaptureMann-${TAG}-macos-arm64.zip" > "CaptureMann-${TAG}-macos-arm64.zip.sha256"

      - name: Release notes from CHANGELOG.md
        run: |
          python3 - <<'PY' > notes.md
          import os, re
          tag = os.environ["TAG"].lstrip("v")
          text = open("CHANGELOG.md").read()
          m = re.search(r"^## \[(?:%s|Unreleased)\].*?\n(.*?)(?=^## \[|\Z)" % re.escape(tag), text, re.S | re.M)
          print((m.group(1).strip() if m else "See CHANGELOG.md."))
          print("\n---\nThis build is signed ad hoc and not notarized: on first launch right-click the app and choose Open, "
                "or run `xattr -dr com.apple.quarantine CaptureMann.app`. macOS 13+ on Apple Silicon.")
          PY

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --draft --prerelease --verify-tag \
            --title "CaptureMann ${TAG}" --notes-file notes.md \
            "target/bundle/CaptureMann-${TAG}-macos-arm64.zip" \
            "target/bundle/CaptureMann-${TAG}-macos-arm64.zip.sha256"
