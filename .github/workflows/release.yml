name: Release

# Push a tag such as `v0.1.0` (or run this workflow by hand with a tag that already exists) to build
# the macOS app and open a DRAFT GitHub release with the DMG and its SHA-256 file. Nothing is
# published until you review the draft and press Publish. Steps: docs/development/releasing.md.
#
# Two modes, chosen by which repository secrets exist (see "Detect signing" below):
#   * signed:  Developer ID certificate + one notarization credential set -> signed, notarized and
#              stapled DMG.
#   * ad hoc:  no signing secrets -> ad hoc signed, NOT notarized DMG, and the release notes say so.
#
# Runner: `macos-14` is the GitHub-documented Apple Silicon (arm64, M1) image
# (https://docs.github.com/actions/using-github-hosted-runners/about-github-hosted-runners). It is
# named explicitly instead of `macos-latest` so the architecture of the release cannot change under
# us; the job also fails if `uname -m` is not arm64.
#
# Pinned actions (commit SHA, tag it was looked up from):
#   actions/checkout          11d5960a326750d5838078e36cf38b85af677262  v4
#   dtolnay/rust-toolchain    b725eda525362e7cf34af9a7243cac1e3f01a7ec  branch `stable` (the action is
#                                                                       selected by branch; the SHA is its tip
#                                                                       when this file was written)
#   Swatinem/rust-cache       9d47c6ad4b02e050fd481d890b2ea34778fd09d6  v2.7.8
#   actions/cache             5a3ec84eff668545956fd18022155c47e93e2684  v4.2.3
#   actions/upload-artifact   ea165f8d65b6e75b540449e92b4886f43607fa02  v4.6.2
#   actions/download-artifact d3f86a106a0bac45b974a628896c90dbdf5c8093  v4.3.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, for example v0.1.0 (must already exist)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build DMG (Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check the tag and the runner
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$TAG' is not of the form vMAJOR.MINOR.PATCH[-suffix]"; exit 1
          fi
          arch=$(uname -m)
          if [ "$arch" != "arm64" ]; then echo "::error::runner is $arch, the release is Apple Silicon only"; exit 1; fi
          sw_vers

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch tip)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: Check the tag matches the workspace version
        run: |
          versions=$(cargo metadata --no-deps --format-version 1 --locked | python3 -c 'import json,sys; print("\n".join(sorted({p["version"] for p in json.load(sys.stdin)["packages"]})))')
          if [ "$(printf '%s\n' "$versions" | wc -l | tr -d ' ')" != "1" ]; then echo "::error::workspace crates have different versions: $versions"; exit 1; fi
          version="$versions"
          if [ "v$version" != "$TAG" ]; then echo "::error::tag $TAG does not match workspace version $version"; exit 1; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # Pre-releases: any 0.x version or a version with a suffix is marked as a pre-release.
          case "$version" in 0.*|*-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;; *) echo "PRERELEASE=false" >> "$GITHUB_ENV" ;; esac

      - name: Release notes from CHANGELOG.md
        run: |
          python3 - <<'PY'
          import os, re, sys
          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          # "## [0.1.0] - 2026-11-01" or "## [0.1.0] - Unreleased": everything up to the next "## [" heading.
          m = re.search(r"^## \[%s\][^\n]*\n(.*?)(?=^## \[|\Z)" % re.escape(version), text, re.S | re.M)
          if not m or not m.group(1).strip():
              print("::error::CHANGELOG.md has no non-empty '## [%s]' section; add it before tagging" % version)
              sys.exit(1)
          open("notes-body.md", "w", encoding="utf-8").write(m.group(1).strip() + "\n")
          PY

      - name: Detect signing secrets
        # Secrets cannot be read in `if:` expressions, so they are mapped to env here and reduced to flags.
        env:
          CERT: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          KEY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID_: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PW: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          signed=false; notary=none
          if [ -n "$KEY_ID" ] && [ -n "$KEY_ISSUER" ] && [ -n "$KEY_P8" ]; then notary=apikey
          elif [ -n "$APPLE_ID_" ] && [ -n "$TEAM_ID" ] && [ -n "$APP_PW" ]; then notary=appleid; fi
          if [ -n "$CERT" ] && [ -n "$CERT_PW" ] && [ "$notary" != none ]; then
            signed=true
          elif [ -n "$CERT" ] || [ "$notary" != none ]; then
            # Half-configured signing is almost certainly a mistake: do not silently ship an ad hoc build.
            echo "::error::signing secrets are incomplete (need APPLE_CERT_P12_BASE64 + APPLE_CERT_PASSWORD and either APPLE_API_KEY_ID + APPLE_API_ISSUER + APPLE_API_KEY_P8 or APPLE_ID + APPLE_TEAM_ID + APPLE_APP_PASSWORD). Complete them or remove all of them for an ad hoc build."
            exit 1
          fi
          echo "SIGNED=$signed" >> "$GITHUB_ENV"
          echo "NOTARY=$notary" >> "$GITHUB_ENV"
          echo "Signed and notarized build: $signed (notarization credentials: $notary)"

      - name: Check cmake and the toolchain
        run: |
          cmake --version
          rustc --version
          xcodebuild -version

      - name: Cache the sherpa-onnx archive and the speaker models
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: packaging/sherpa/.downloads
          key: sherpa-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/sherpa/fetch-macos.sh', 'packaging/sherpa/fetch-models.sh') }}

      - name: Fetch the sherpa-onnx libraries and speaker models (pinned, SHA-256 checked)
        run: make sherpa

      - name: Cache the FFmpeg build
        id: ffcache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            packaging/ffmpeg/.downloads
            packaging/ffmpeg/out
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/ffmpeg/build-macos.sh') }}

      - name: Build the LGPL FFmpeg (pinned sources)
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: make ffmpeg

      - name: Check the FFmpeg build is present
        run: |
          test -x packaging/ffmpeg/out/ffmpeg && test -x packaging/ffmpeg/out/ffprobe || { echo "::error::packaging/ffmpeg/out is incomplete"; exit 1; }

      - name: Third-party licences
        run: |
          make licenses
          if ! git diff --quiet -- THIRD_PARTY_LICENSES.md; then
            echo "::warning::THIRD_PARTY_LICENSES.md differs from the committed file; run 'make licenses' and commit it before tagging"
          fi

      # ---------------------------------------------------------------- signed path
      - name: Import the Developer ID certificate
        if: env.SIGNED == 'true'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: bash packaging/macos/ci-keychain.sh setup # appends CM_SIGN_IDENTITY and CM_KEYCHAIN to $GITHUB_ENV

      - name: Write the App Store Connect API key
        if: env.SIGNED == 'true' && env.NOTARY == 'apikey'
        env:
          KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Bundle (hardened runtime, Developer ID)
        if: env.SIGNED == 'true'
        run: CM_HARDENED=1 make bundle-release

      - name: Make the DMG (signed)
        if: env.SIGNED == 'true'
        env:
          CM_DMG_VOLNAME: CaptureMann ${{ env.VERSION }}
        run: bash packaging/macos/dmg.sh target/bundle/CaptureMann.app "target/bundle/CaptureMann-${TAG}-macos-arm64.dmg"

      - name: Notarize and staple
        if: env.SIGNED == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash packaging/macos/notarize.sh "target/bundle/CaptureMann-${TAG}-macos-arm64.dmg"

      - name: Verify the release (signature, notarization, Gatekeeper)
        if: env.SIGNED == 'true'
        run: bash packaging/macos/verify-release.sh "target/bundle/CaptureMann-${TAG}-macos-arm64.dmg"

      # ---------------------------------------------------------------- ad hoc path
      - name: Bundle (ad hoc)
        if: env.SIGNED != 'true'
        run: make bundle-release

      - name: Make the DMG (ad hoc)
        if: env.SIGNED != 'true'
        env:
          CM_DMG_VOLNAME: CaptureMann ${{ env.VERSION }}
        run: bash packaging/macos/dmg.sh target/bundle/CaptureMann.app "target/bundle/CaptureMann-${TAG}-macos-arm64.dmg"

      - name: Verify the DMG (ad hoc, not notarized)
        if: env.SIGNED != 'true'
        run: bash packaging/macos/verify-release.sh "target/bundle/CaptureMann-${TAG}-macos-arm64.dmg" --allow-unsigned

      # ---------------------------------------------------------------- common
      - name: Checksum and release notes
        run: |
          cd target/bundle
          shasum -a 256 "CaptureMann-${TAG}-macos-arm64.dmg" > "CaptureMann-${TAG}-macos-arm64.dmg.sha256"
          cat "CaptureMann-${TAG}-macos-arm64.dmg.sha256"
          cd "$GITHUB_WORKSPACE"
          {
            cat notes-body.md
            printf '\n---\n\n'
            printf 'Apple Silicon (arm64) only, macOS 13 or later. Verify the download: `shasum -a 256 -c CaptureMann-%s-macos-arm64.dmg.sha256` in the folder with both files.\n\n' "$TAG"
            if [ "$SIGNED" = "true" ]; then
              printf 'This DMG is signed with a Developer ID certificate, notarized by Apple and stapled.\n'
            else
              printf 'This build is **ad hoc signed and not notarized**, so Gatekeeper blocks the first launch. Drag CaptureMann to Applications, then either right-click the app and choose Open (and confirm), or run `xattr -dr com.apple.quarantine /Applications/CaptureMann.app`. Because the signature changes with every build, macOS asks for the Screen Recording permission again after an update.\n'
            fi
          } > notes.md

      - name: Keep the release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: |
            target/bundle/CaptureMann-${{ env.TAG }}-macos-arm64.dmg
            target/bundle/CaptureMann-${{ env.TAG }}-macos-arm64.dmg.sha256
            notes.md
          if-no-files-found: error
          retention-days: 14

      - name: Remove the signing keychain and key (always)
        if: always()
        run: |
          if [ "$SIGNED" = "true" ]; then bash packaging/macos/ci-keychain.sh teardown || true; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"

  release:
    name: Create the draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release; no other job has this
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: release-files

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A draft, always. Versions 0.x and versions with a suffix are also marked as pre-releases.
          version="${TAG#v}"
          flags="--draft"
          case "$version" in 0.*|*-*) flags="$flags --prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::a release for $TAG already exists; delete it (or use a new tag) before re-running"; exit 1
          fi
          # shellcheck disable=SC2086
          gh release create "$TAG" $flags --verify-tag \
            --title "CaptureMann ${TAG}" --notes-file release-files/notes.md \
            "release-files/target/bundle/CaptureMann-${TAG}-macos-arm64.dmg" \
            "release-files/target/bundle/CaptureMann-${TAG}-macos-arm64.dmg.sha256"
