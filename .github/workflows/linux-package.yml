name: Linux package

# Run by hand (Actions > Linux package > Run workflow) to build the early-build tarball
# capturemann-<version>-linux-<arch>.tar.gz and capturemann_<version>_<amd64|arm64>.deb (+ .sha256 each) on x86_64 (ubuntu-24.04) and aarch64
# (ubuntu-24.04-arm), with an LGPL FFmpeg built from source. The files are kept as WORKFLOW ARTIFACTS
# only: this workflow creates no tag and no GitHub release (a release is a maintainer step, see
# docs/development/releasing.md, "Linux early build"). It does not run on pull requests: a full
# release build takes too long for that; the packaging scripts are tried in the VM and by hand.
#
# After the packages, the job `apt-repo` builds a signed APT repository from both architectures' .deb files with a
# THROWAWAY key and proves add source -> install -> upgrade -> remove -> purge in a clean ubuntu:24.04 container
# (packaging/linux/test-apt-repo.sh). Nothing is published; the real repository is made by the maintainer with the real
# key (docs/development/linux-apt.md).
#
# Pinned actions: the same commits as ci.yml and release.yml.
on:
  workflow_dispatch:
    inputs:
      with_ffmpeg:
        description: "Build and bundle the LGPL FFmpeg (packaging/ffmpeg/build-linux.sh; adds about 10 minutes)"
        type: boolean
        default: true
      with_llama:
        description: "Build and bundle llama-server, the built-in text engine (packaging/llama/build-linux.sh; adds about 5 minutes)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: linux-package-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Tarball (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - name: Check the runner
        run: |
          if [ "$(uname -m)" != "${{ matrix.arch }}" ]; then echo "::error::runner is $(uname -m), expected ${{ matrix.arch }}"; exit 1; fi
          . /etc/os-release; echo "$PRETTY_NAME"; ldd --version | head -1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch tip)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Build dependencies: the list ci.yml uses, plus what FFmpeg's configure needs (nasm on x86_64, libva
      # for VAAPI). No ffmpeg package: the tests are not run here, and the shipped FFmpeg is built below.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config nasm curl xz-utils \
            libasound2-dev libxkbcommon-x11-dev libxkbcommon-dev libwayland-dev libxcb1-dev libx11-xcb-dev \
            libvulkan-dev libfontconfig-dev libssl-dev libpipewire-0.3-dev libclang-dev \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libgbm-dev libegl-dev libdbus-1-dev \
            libdrm-dev libva-dev desktop-file-utils
      # The speaker engine: the pinned sherpa-onnx static libraries (linked into cm-desktop) and the two
      # speaker models (shipped in the tarball). SHA-256 checked by the scripts; the cargo build downloads nothing.
      - name: Cache the sherpa-onnx archive and the speaker models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packaging/sherpa/.downloads
          key: sherpa-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/sherpa/fetch-linux.sh', 'packaging/sherpa/fetch-models.sh') }}
      - name: Fetch the sherpa-onnx libraries and speaker models (pinned, SHA-256 checked)
        run: make sherpa
      - name: Cache the FFmpeg sources
        if: ${{ inputs.with_ffmpeg }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packaging/ffmpeg/.downloads
          key: ffmpeg-src-${{ hashFiles('packaging/ffmpeg/build-linux.sh') }}
      - name: Build the LGPL FFmpeg
        if: ${{ inputs.with_ffmpeg }}
        run: packaging/ffmpeg/build-linux.sh
      - name: Cache the llama.cpp source
        if: ${{ inputs.with_llama }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packaging/llama/.downloads
          key: llama-src-${{ hashFiles('packaging/llama/build-macos.sh') }}
      # MIT, static, CPU only; the pinned tag and SHA-256 are read from build-macos.sh. A helper program
      # next to the app, never linked into it. The tarball step refuses it if it needs more than libc/libm.
      - name: Build llama-server (text engine)
        if: ${{ inputs.with_llama }}
        run: packaging/llama/build-linux.sh
      - name: Build the tarball
        env:
          CM_REQUIRE_SHERPA: "1"
          CM_REQUIRE_SPEAKER_MODELS: "1"
          CM_REQUIRE_LLAMA: ${{ inputs.with_llama && '1' || '0' }}
          CM_LLAMA_BUNDLE: ${{ inputs.with_llama && format('{0}/packaging/llama/out', github.workspace) || '' }}
          CM_REQUIRE_FFMPEG: ${{ inputs.with_ffmpeg && '1' || '0' }}
          CM_FFMPEG_BUNDLE: ${{ inputs.with_ffmpeg && format('{0}/packaging/ffmpeg/out-linux-{1}', github.workspace, matrix.arch) || '' }}
        run: packaging/linux/build-linux.sh
      - name: Check the tarball (checksum, install, uninstall, desktop entry)
        run: |
          cd packaging/linux/out
          sha256sum -c ./*.sha256
          work=$(mktemp -d); tar -xzf ./*.tar.gz -C "$work"; cd "$work"/capturemann-*
          ./install.sh --prefix "$work/prefix"
          "$work/prefix/bin/capturemann" --version
          test -f "$work/prefix/lib/Resources/Models/speaker/pyannote-segmentation-3-0.onnx"
          test -f "$work/prefix/share/doc/capturemann/SHERPA-ONNX/ThirdPartyNotices-onnxruntime.txt"
          if [ "${{ inputs.with_llama }}" = true ]; then
            "$work/prefix/lib/capturemann/llama-server" --version
            test -f "$work/prefix/lib/capturemann/Llama/LICENSES/llama.cpp-LICENSE.txt"
          fi
          desktop-file-validate "$work/prefix/share/applications/dev.capturemann.app.desktop"
          ./install.sh --uninstall --prefix "$work/prefix"
      # The .deb is made from the tarball just built (packaging/linux/build-deb.sh), so it holds the same files.
      # It is installed on the runner with apt (which pulls the Depends: libraries), run once, and removed.
      - name: Build the .deb
        env:
          CM_DEB_MAINTAINER: "CraftMann <trungtlt@outlook.com>"
        run: packaging/linux/build-deb.sh
      # The release checker (packaging/linux/check-package.sh): architecture, glibc ceiling, no bundled system or
      # GPU libraries, licence files (LICENSE, NOTICE, THIRD_PARTY_LICENSES, FFmpeg source offer, llama.cpp MIT),
      # desktop entry, the programs start. The FFmpeg and llama.cpp inputs are required unless the run turned them off.
      - name: Check the packages (check-package.sh)
        run: |
          allow=""
          [ "${{ inputs.with_ffmpeg }}" = true ] || allow="ffmpeg"
          [ "${{ inputs.with_llama }}" = true ] || allow="${allow:+$allow,}llama"
          cd packaging/linux/out
          for f in ./*.tar.gz ./*.deb; do
            ../check-package.sh --allow-missing "$allow" "$f"
          done
      - name: Check the .deb (install with apt, run, remove)
        run: |
          cd packaging/linux/out
          sha256sum -c ./*.deb.sha256
          dpkg-deb -I ./*.deb | sed -n '/Depends:/,/Section:/p'
          sudo apt-get install -y --no-install-recommends ./*.deb
          capturemann --version
          cm-mcp --version || true
          desktop-file-validate /usr/share/applications/dev.capturemann.app.desktop
          test -f /opt/capturemann/lib/Resources/Models/speaker/pyannote-segmentation-3-0.onnx
          sudo apt-get remove -y capturemann
          test ! -e /opt/capturemann && test ! -e /usr/bin/capturemann && test ! -e /usr/share/applications/dev.capturemann.app.desktop
      - name: Keep the files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capturemann-linux-${{ matrix.arch }}
          path: |
            packaging/linux/out/*.tar.gz
            packaging/linux/out/*.sha256
            packaging/linux/out/*.deb
          if-no-files-found: error
          retention-days: 14
      # The shipped programs are stripped; these are the same builds with debug info, for reading backtraces.
      - name: Keep the unstripped programs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capturemann-linux-${{ matrix.arch }}-debug
          path: packaging/linux/out/debug/
          if-no-files-found: error
          retention-days: 14

  # The APT repository, built from the artifacts of both architectures and tried on both: the hosted
  # amd64 runner uses an amd64 container, the arm runner an arm64 one. A throwaway key signs it.
  apt-repo:
    name: APT repository (${{ matrix.arch }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HAVE_KEY: ${{ secrets.APT_SIGNING_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the repository tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils gnupg gpgv xz-utils curl
      # The two package artifacts (not the -debug ones, which are about 700 MB each).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: capturemann-linux-x86_64
          path: debs-and-tarballs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: capturemann-linux-aarch64
          path: debs-and-tarballs
      - name: Keep only the .deb files
        run: |
          mkdir debs
          find debs-and-tarballs -name '*.deb' -exec cp {} debs/ \;
          ls -l debs; test "$(ls debs/*.deb | wc -l)" -eq 2
      # pool layout (dists/ and pool/): install, upgrade, tamper check, remove, purge
      - name: Install, upgrade, remove through the pool repository
        run: packaging/linux/test-apt-repo.sh --runner docker --layout pool debs/*.deb
      # flat layout (every file in one folder, for a release-asset host)
      - name: Install, upgrade, remove through the flat repository
        run: packaging/linux/test-apt-repo.sh --runner docker --layout flat debs/*.deb
      # The repository the maintainer would publish, made only when the signing key is a repository secret
      # (APT_SIGNING_KEY: the armored secret key, APT_SIGNING_PASSPHRASE: its passphrase). Without them this
      # step is skipped. Kept as a workflow artifact for 14 days, never uploaded anywhere else.
      - name: Build the signed repository (only with the real key as a secret)
        if: ${{ matrix.arch == 'x86_64' && env.HAVE_KEY == 'true' }}
        env:
          CM_APT_GPG_PRIVATE_KEY: ${{ secrets.APT_SIGNING_KEY }}
          CM_APT_GPG_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: packaging/linux/make-apt-repo.sh --out apt-repo --url "${{ vars.APT_REPO_URL }}" debs/*.deb
      - name: Keep the signed repository
        if: ${{ matrix.arch == 'x86_64' && env.HAVE_KEY == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capturemann-apt-repo
          path: apt-repo
          if-no-files-found: error
          retention-days: 14
