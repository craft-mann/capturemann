name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1" # Mondays 04:41 UTC: catches a new stable Rust or a yanked dependency without a commit

# Least privilege: no job writes to the repository.
permissions:
  contents: read

# A new push to a PR cancels its older run; main runs always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows and Linux jobs start before any backend exists (platform plan, Step 0): they keep the
        # shared crates building and their fake-based tests passing on every OS. Hosted runners have no
        # screen permission, camera or microphone, so the hardware tests stay manual (verification/).
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch tip)
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      # The FFmpeg-gated tests (export: EXP AC3, AC6-AC8) print SKIPPED and pass when no ffmpeg is
      # on PATH, so install one; otherwise CI would not cover the export path at all.
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      # Ubuntu 24.04, not 22.04: the exporter needs FFmpeg 5.1+ (`-fps_mode`) and 22.04 ships 4.4. The shipped
      # build bundles its own FFmpeg, so this only concerns the tests.
      # System libraries the GPUI shell and the capture crates link on Linux (assumed list: trim or extend
      # it from the first runs).
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg cmake pkg-config libasound2-dev \
            libxkbcommon-x11-dev libxkbcommon-dev libwayland-dev libxcb1-dev libx11-xcb-dev libvulkan-dev \
            libfontconfig-dev libssl-dev libpipewire-0.3-dev libclang-dev \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev \
            libgbm-dev libegl-dev libdbus-1-dev libdrm-dev xvfb openbox gnome-keyring
      - run: ffmpeg -hide_banner -version
      # The speaker engine (AI-8) links the pinned sherpa-onnx static libraries; `.cargo/config.toml`
      # points SHERPA_ONNX_LIB_DIR at packaging/sherpa/out/lib. The build never downloads them.
      - name: Cache the sherpa-onnx archive and the speaker models
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: packaging/sherpa/.downloads
          key: sherpa-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/sherpa/fetch-macos.sh', 'packaging/sherpa/fetch-models.sh') }}
      - name: Fetch the sherpa-onnx libraries and speaker models (pinned, SHA-256 checked)
        if: runner.os == 'macOS'
        run: make sherpa
      - run: cargo fmt --all -- --check
      - name: Clippy
        if: runner.os == 'macOS'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        if: runner.os == 'macOS'
        run: cargo test --workspace --locked
      # No sherpa-onnx static libraries for these targets yet (speaker finding moves to 0.3.x, D-W5), so
      # the `sherpa` default feature is off there.
      - name: Clippy (no sherpa)
        if: runner.os != 'macOS'
        run: cargo clippy --workspace --all-targets --locked --no-default-features -- -D warnings
      - name: Test (no sherpa)
        if: runner.os != 'macOS'
        # TEMP (branch windows-step0): only the new platform tests; restore the full command.
        run: cargo test --locked --no-default-features -p cm-platform -p cm-auth --test credential_store
      # The real Trash (Recycle Bin, freedesktop Trash) of the runner: a scratch folder is moved there. Not run
      # on macOS, where it would use the developer's own Trash.
      - name: Trash test (Windows and Linux)
        if: runner.os != 'macOS'
        run: cargo test -p cm-platform --lib --locked --no-default-features -- --ignored
      # L1 on Linux: the Secret Service for real, an unlocked gnome-keyring in a private D-Bus session.
      - name: Secret Service tests (Linux)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- sh -c 'echo "" | gnome-keyring-daemon --unlock --components=secrets >/dev/null; cargo test -p cm-auth --test credential_store --locked --no-default-features -- --ignored'
      # CAP-1 on Linux: the real-display tests against a virtual X server (Xvfb with a window manager, so
      # the window list works). Never a real screen. A Wayland session is not covered here (portal path).
      - name: Real display tests on Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" sh -c 'openbox & sleep 2; XDG_SESSION_TYPE=x11 cargo test -p cm-capture --test real_display --locked --no-default-features -- --ignored --test-threads=1'

  # `rust-version` in Cargo.toml is a promise; this job keeps it. 1.95 is the oldest compiler the
  # GPUI dependency builds with (it uses `std::hint::cold_path`); 1.93 and older fail. `cargo +1.95`
  # bypasses rust-toolchain.toml, which selects stable.
  msrv:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch tip)
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      # The speaker engine (AI-8) links the pinned sherpa-onnx static libraries; `.cargo/config.toml`
      # points SHERPA_ONNX_LIB_DIR at packaging/sherpa/out/lib. The build never downloads them.
      - name: Cache the sherpa-onnx archive and the speaker models
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: packaging/sherpa/.downloads
          key: sherpa-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/sherpa/fetch-macos.sh', 'packaging/sherpa/fetch-models.sh') }}
      - name: Fetch the sherpa-onnx libraries and speaker models (pinned, SHA-256 checked)
        run: make sherpa
      - run: cargo +1.95 check --workspace --all-targets --locked

  bundle-macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch tip)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      # The speaker engine (AI-8) links the pinned sherpa-onnx static libraries; `.cargo/config.toml`
      # points SHERPA_ONNX_LIB_DIR at packaging/sherpa/out/lib. The build never downloads them.
      - name: Cache the sherpa-onnx archive and the speaker models
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: packaging/sherpa/.downloads
          key: sherpa-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/sherpa/fetch-macos.sh', 'packaging/sherpa/fetch-models.sh') }}
      - name: Fetch the sherpa-onnx libraries and speaker models (pinned, SHA-256 checked)
        run: make sherpa
      - run: make licenses
      - run: bash packaging/macos/bundle.sh
      - run: codesign --verify --deep --strict target/bundle/CaptureMann.app
      - name: Show entitlements
        run: codesign -d --entitlements - target/bundle/CaptureMann.app
      - run: ditto -c -k --keepParent target/bundle/CaptureMann.app target/bundle/CaptureMann.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CaptureMann-macos-adhoc
          path: target/bundle/CaptureMann.zip
          retention-days: 3

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Every relative link in a Markdown file must point at a tracked file.
      - run: python3 scripts/check_md_links.py
      # target_os only in platform code (the older files are a shrinking baseline).
      - run: python3 scripts/check_target_os.py

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # `command` is the whole subcommand line: `arguments` goes after it and would be read as
          # a second subcommand (the job failed with "unrecognized subcommand 'licenses'").
          command: check licenses bans sources advisories
