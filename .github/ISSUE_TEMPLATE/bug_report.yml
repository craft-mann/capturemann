name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Screenshots help; please do not attach recordings with private content.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CaptureMann version
      description: Settings → About, or `capturemann --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.1, MacBook Pro M3
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines only. Remove tokens, file paths you consider private, and account names.
      render: text
